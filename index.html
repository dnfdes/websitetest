<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Challenge Preview</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background: #000; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        .image-box {
            width: 100vw; /* 가로폭을 화면에 꽉 차게 */
            display: flex;
            justify-content: center;
        }
        img { 
            width: 100%; /* 가로폭 맞춤 */
            height: auto; /* 비율 유지 */
            display: block; 
        }
    </style>
</head>
<body>

    <div class="image-box"><img src="images/1.jpg" alt="1"></div>
    <div class="image-box"><img src="images/2.jpg" alt="2"></div>
    <div class="image-box"><img src="images/3.jpg" alt="3"></div>

    <script>
        let index = 0;
        const boxes = document.querySelectorAll('.image-box');

        document.addEventListener('keydown', function(event) {
            // 우측 방향키를 눌렀을 때만 실행
            if (event.key === 'ArrowRight') {
                index++;
                // 마지막 이미지 이후로는 넘기지 않음
                if (index < boxes.length) {
                    // 해당 이미지 박스의 상단 위치로 부드럽게 이동
                    boxes[index].scrollIntoView({ behavior: 'smooth', block: 'start' });
                } else {
                    index = boxes.length - 1; // 마지막 인덱스 유지
                }
            }
        });
    </script>
</body>
</html>
