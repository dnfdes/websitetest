<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Challenge Preview</title>
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; }
        
        .image-box {
            display: none; /* 일단 다 숨김 */
            width: 100vw;
            height: 100vh; /* 화면 높이 고정 */
            overflow-y: auto; /* 핵심: 박스 내부에서만 스크롤 허용 */
            justify-content: center;
        }
        
        .image-box.active { display: flex; } /* 활성화된 것만 표시 */
        
        img { 
            width: 100%; /* 가로폭 꽉 채움 */
            height: auto; /* 세로 길이는 이미지에 맞게 자동 늘어남 */
            display: block;
        }
    </style>
</head>
<body>

    <div class="image-box active"><img src="images/1.jpg" alt="1"></div>
    <div class="image-box"><img src="images/2.jpg" alt="2"></div>
    <div class="image-box"><img src="images/3.jpg" alt="3"></div>

    <script>
        let index = 0;
        const boxes = document.querySelectorAll('.image-box');

        document.addEventListener('keydown', function(event) {
            if (event.key === 'ArrowRight') {
                if (index < boxes.length - 1) {
                    boxes[index].classList.remove('active');
                    index++;
                    boxes[index].classList.add('active');
                }
            } else if (event.key === 'ArrowLeft') {
                if (index > 0) {
                    boxes[index].classList.remove('active');
                    index--;
                    boxes[index].classList.add('active');
                }
            }
        });
    </script>
</body>
</html>
