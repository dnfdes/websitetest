<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Challenge Preview</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background: #000; 
        }
        .image-box {
            width: 100vw;
            /* 높이를 고정하지 않아 긴 이미지도 스크롤로 다 볼 수 있음 */
            display: flex;
            justify-content: center;
            /* 이미지 사이의 명확한 구분을 위해 여백 추가 */
            margin-bottom: 100px; 
            /* scroll-margin을 통해 방향키 이동 시 상단에 딱 붙게 함 */
            scroll-margin-top: 0px;
        }
        img { 
            width: 100%; 
            height: auto; 
            display: block; 
        }
    </style>
</head>
<body>

    <div class="image-box"><img src="images/1.jpg" alt="1"></div>
    <div class="image-box"><img src="images/2.jpg" alt="2"></div>
    <div class="image-box"><img src="images/3.jpg" alt="3"></div>

    <script>
        let index = 0;
        const boxes = document.querySelectorAll('.image-box');

        document.addEventListener('keydown', function(event) {
            // 우측 방향키를 눌렀을 때만 이동
            if (event.key === 'ArrowRight') {
                if (index < boxes.length - 1) {
                    index++;
                    // 다음 이미지 박스의 맨 위로 부드럽게 이동
                    boxes[index].scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            } else if (event.key === 'ArrowLeft') {
                if (index > 0) {
                    index--;
                    boxes[index].scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            }
        });
    </script>
</body>
</html>
