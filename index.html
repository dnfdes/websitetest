<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Challenge Preview - 가로맞춤</title>
    <style>
        /* 기본 스크롤바 숨기기 (선택사항, 깔끔함을 위해) */
        body::-webkit-scrollbar { display: none; } 
        body { 
            margin: 0; 
            padding: 0; 
            background: #000; 
            /* 자바스크립트로 스크롤을 제어하므로 기본 스크롤 동작을 막습니다. */
            overflow: hidden; 
        }
        
        #container {
            width: 100vw;
            display: flex;
            flex-direction: column; /* 세로로 나열 */
        }

        .image-box {
            width: 100vw;
            /* 높이를 지정하지 않아 이미지 비율에 따라 결정되도록 함 */
            display: flex;
            justify-content: center;
            align-items: flex-start; /* 이미지가 상단에 맞춥니다. */
        }
        
        img { 
            width: 100%;       /* 화면 가로폭에 꽉 차게 */
            height: auto;      /* 가로폭에 맞춰 세로 비율 자동 조절 */
            display: block;
        }
    </style>
</head>
<body>

    <div id="container">
        <div class="image-box"><img src="images/1.jpg" alt="1"></div>
        <div class="image-box"><img src="images/2.jpg" alt="2"></div>
        <div class="image-box"><img src="images/3.jpg" alt="3"></div>
        <div class="image-box"><img src="images/4.jpg" alt="4"></div>
    </div>

    <script>
        let index = 0;
        const boxes = document.querySelectorAll('.image-box');
        const container = document.getElementById('container');

        document.addEventListener('keydown', function(event) {
            if (event.key === 'ArrowRight' || event.key === ' ') { // 오른쪽 키 또는 스페이스바
                if (index < boxes.length - 1) {
                    index++;
                    scrollToImage(index);
                }
            } else if (event.key === 'ArrowLeft') { // 왼쪽 키
                if (index > 0) {
                    index--;
                    scrollToImage(index);
                }
            }
        });

        // 특정 순서의 이미지로 부드럽게 스크롤하는 함수
        function scrollToImage(idx) {
            // 해당 이미지 박스의 절대적인 상단 위치를 계산
            const targetOffsetTop = boxes[idx].offsetTop;
            
            // 부드럽게 스크롤 이동
            window.scrollTo({
                top: targetOffsetTop,
                behavior: 'smooth'
            });
        }
        
        // 마우스 휠 이벤트로도 한 장씩 넘기기 (추가 기능)
        window.addEventListener('wheel', function(event) {
            event.preventDefault(); // 기본 스크롤 막기
            if (event.deltaY > 0) { // 휠 아래로
                if (index < boxes.length - 1) {
                    index++;
                    scrollToImage(index);
                }
            } else { // 휠 위로
                if (index > 0) {
                    index--;
                    scrollToImage(index);
                }
            }
        }, { passive: false });

    </script>
</body>
</html>
